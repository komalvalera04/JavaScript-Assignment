<!-- 7,8. Use const to create an array called favoriteSongs containing three song titles you like on Spotify. Try to add a fourth song using push(), then print the array. Explain in a comment why this works even though the array was declared with const.<br><br><em><strong>Hint:</strong> const prevents reassignment of the variable, not mutation of the array contents.</em> -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const favsongs = ['memories','believer','dandelions'];
        console.log(favsongs);

        favsongs.push('bad lier');
        console.log('The new value of array:', favsongs);
    </script>
</body>
</html>
