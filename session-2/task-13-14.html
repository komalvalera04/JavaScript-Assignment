<!-- 13,14. Write a function showProfile that takes a name, followers, and isPremium (boolean) as arguments. Inside the function, use dynamic typing to assign a string to followers, then a number, and finally print the type of followers each time using typeof. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function showProfile(name, followers, isPremium) {
            followers = "1000";
            console.log(typeof followers); // string

            followers = 1000;
            console.log(typeof followers); // number
        }
        showProfile("Komal", 50, true);
    </script>
</body>
</html>
