<!-- 15. Write a function displayProfile that takes a userName and followers as parameters and prints a formatted string like 'Aarya has 1500 followers' to the console. Call this function with your own details. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function displayProfile(userName, followers){
            console.log(`${userName} has ${followers} followers`);
        }
        displayProfile("Komal",50)
    </script>
</body>
</html>
