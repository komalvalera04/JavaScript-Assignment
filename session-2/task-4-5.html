<!-- 4,5. Declare a variable using var to store the name of your favorite food delivery app (like 'Zomato' or 'Swiggy'). Then, reassign it to another app name and print both values to the console to show how var allows reassignment and redeclaration. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var foodapp = 'Zomato';
        console.log("My favourite food app is:", foodapp);
        
        foodapp = 'Swiggy'; // Reassignment of variable
        console.log("Reassignment of variable:", foodapp);

        var foodapp = 'Uber Eats'; // Redeclaration of variable
        console.log("Redeclaration of variable:", foodapp);
    </script>
</body>
</html>
