<!-- 12. Show the difference between primitive and reference types by creating a variable favFood = 'pizza' and another variable favFoodCopy = favFood. Change favFood to 'burger' and log both variables. Then, create an object zomatoUser with a property city, assign it to another variable, change the city in one, and log both objects.<br><br><em><strong>Hint:</strong> Observe how changes affect primitives vs objects.</em> -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let favFood = 'pizza';
        let favFoodCopy = favFood;             // Copies the value
        favFood = 'burger';

        console.log(favFood);                  // burger
        console.log(favFoodCopy);              // pizza


        let zomatoUser = {
            city: 'Ahmedabad'
        };
        let zomatoUserCopy = zomatoUser;       // Points to the same object
        zomatoUser.city = 'Mumbai';

        console.log(zomatoUser);               // { city: 'Mumbai' }
        console.log(zomatoUserCopy); 
    </script>
</body>
</html>
