<!-- 6. Write a function isEligibleForDiscount(totalAmount) that returns true if the totalAmount is greater than or equal to 500, otherwise false. Test it with values 300 and 700.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function isEligibleForDiscount(totalAmount){
            if(totalAmount>=500){
                return "You are eligible for discount";
            }else{
                return "You are not eligible for discount";
            }
        }
        console.log(isEligibleForDiscount(300));    
        console.log(isEligibleForDiscount(700));
    </script>
</body>
</html>
