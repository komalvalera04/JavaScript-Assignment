<!-- 3. Create a JavaScript file called likeCounter.js that declares a variable likes with value 0, increments it by 1 using the += operator, and logs the updated likes count to the console.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var likes=0;
        likes += 1;

        console.log("Likes:", likes);
    </script>
</body>
</html>
