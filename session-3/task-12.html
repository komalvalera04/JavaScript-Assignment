<!-- 12. Given a variable username, write a condition that checks if username is truthy, and if so, logs 'Welcome, [username]!', otherwise logs 'Guest Login'.<br><br><em><strong>Hint:</strong> Try with username = '', username = null, and username = 'Priya'.</em> -->


<script>
    let username = "";

    if (username) {
        console.log("Welcome, " + username + "!");
    } else {
        console.log("Guest Login");
    }

    username = null;

    if (username) {
        console.log("Welcome, " + username + "!");
    } else {
        console.log("Guest Login");
    }

    username = "Priya";

    if (username) {
        console.log("Welcome, " + username + "!");
    } else {
        console.log("Guest Login");
    }


</script>
