<!-- 4,5. Given an array of cricket team names for IPL, use a while loop to print each team name in uppercase. -->


<script>
    let teams = [
        'Chennai Super Kings',
        'Mumbai Indians',
        'Kolkata Knight Riders',
        'Rajasthan Royals',
        'Delhi Capitals',
        'Punjab Kings',
        'Gujarat Titans'
    ];

    let i = 0;

    while (i < teams.length) {
        console.log(teams[i].toUpperCase());
        i++;
    }

</script>
