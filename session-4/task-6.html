<!-- 6. Given an array of Instagram usernames, use a while loop to print each username in uppercase. -->

<script>
    let usernames = ['komal', 'mishwa', 'ronak', 'harsh', 'arjun'];

    let i = 0;

    while (i < usernames.length) {
        console.log(usernames[i].toUpperCase());
        i++;
    }

</script>
