<!-- 15. Use the forEach method to loop through an array of cricket team names (e.g., 'MI', 'CSK', 'RCB', 'GT') and print 'Go [team]!' for each.<br><br><em><strong>Hint:</strong> forEach takes a callback function with the current element as a parameter.</em> -->

<script>
    let teams = ['MI', 'CSK', 'RCB','GT'];

    teams.forEach((team) => {
        console.log("Go " + team + "!");
    });

</script>
