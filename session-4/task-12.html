<!-- 12. Given an array of Flipkart product prices, use a for-of loop to calculate and print the total price of all products. -->


<script>
    let prices = [15000, 50000, 2000, 5000];
    console.log(prices);

    let total = 0;

    for (let price of prices) {
        total += price;
    }
    console.log("Total Price:", total);
</script>
