<!-- 10,11. Given an array of objects representing Flipkart products (each with name and price), use a for-of loop to print only the product names. -->


<script>
    let products = [
        { name: "Smartphone", price: 15000 },
        { name: "Laptop", price: 50000 },
        { name: "Headphones", price: 2000 },
        { name: "Smartwatch", price: 5000 }
    ];

    for (let product of products) {
        console.log(product.name);
    }

</script>
