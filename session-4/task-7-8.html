<!-- 7,8. Create an array called playlist with 4 song names (strings). Use a do-while loop to print each song name along with its index (e.g., '0: Kesariya') in the console. -->


<script>
    let playlist = ['memories','believer','dandelions'];

    let i = 0;

    do {
        console.log(i + ": " + playlist[i]);
        i++;
    } while (i < playlist.length);

</script>
