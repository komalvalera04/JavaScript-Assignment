<!-- 6. Build a simple Zomato-style food order form with a dropdown for cuisine and an input for quantity — use the onchange event on the dropdown to display a message showing which cuisine was selected. -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <div class="card shadow mx-auto" style="max-width: 450px;">

            <div class="card-body p-4">

                <h2 class="text-center text-danger mb-4">Food Order</h2>

                <form>
                    <div class="mb-3">
                        <label for="cuisine" class="form-label">Choose Cuisine</label>

                        <select id="cuisine" class="form-select" onchange="showCuisine(this.value)">
                            <option value="">-- Select Cuisine --</option>
                            <option value="Indian">Indian</option>
                            <option value="Chinese">Chinese</option>
                            <option value="Italian">Italian</option>
                            <option value="Mexican">Mexican</option>
                            <option value="Thai">Thai</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="quantity" class="form-label">Quantity</label>

                        <input type="number" id="quantity" class="form-control" min="1" placeholder="Enter quantity">
                    </div>

                    <div id="message" class="alert alert-danger d-none"></div>

                    <button type="submit" class="btn btn-danger w-100">Order Now</button>
                </form>

            </div>
        </div>
    </div>

    <script>
        function showCuisine(cuisine) {
            const message = document.getElementById("message");

            if (cuisine === "") {
                message.classList.add("d-none");
                message.textContent = "";
            } else {
                message.classList.remove("d-none");
                message.textContent = "You selected " + cuisine + " cuisine.";
            }
        }
    </script>
    
</body>
</html>
