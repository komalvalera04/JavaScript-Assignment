<!-- 3. Create an HTML page with a button labeled 'Add Song' — when the button is clicked, use onclick to instantly add a new card below showing a random song title from your favorite playlist. -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <body class="bg-light">

    <div class="container py-5">
        <div class="text-center mb-4">
            <h1 class="fw-bold">My Playlist</h1>
            <p class="text-muted">Click the button to add a random song.</p>

            <button onclick="addSong()" class="btn btn-primary">Add Song</button>
        </div>

        <div id="songContainer" class="row g-3"></div>
    </div>

    <script>
        const songs = [
            "Memories",
            "Believer",
            "Perfect",
            "Dandelions"
        ];

        function addSong() {
        const randomSong = songs[Math.floor(Math.random() * songs.length)];

        const card = document.createElement("div");
        card.className = "col-md-6 col-lg-4";

        card.innerHTML = `
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h5 class="card-title">${randomSong}</h5>
                    <p class="card-text text-muted">
                    </p>
                </div>
            </div>
        `;

        document.getElementById("songContainer").appendChild(card);
        }
    </script>
</body>
</html>
