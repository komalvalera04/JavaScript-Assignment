<!-- 4,5. Build a mini form with an input for 'Username' and use the onchange event to log the entered username to the console every time the input changes. -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" onchange="logUsername(this.value)">
    </form>

    <script>
        function logUsername(username) {
            console.log("Username:", username);
        }
    </script>
</body>
</html>
