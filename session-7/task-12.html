<!-- 12. Display the X and Y coordinates of the mouse when you click anywhere inside a div by using the event object in your click event handler.<br><br><em><strong>Hint:</strong> Use event.clientX and event.clientY to get coordinates.</em> -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">

        <div id="mouseArea" class="bg-primary text-white d-flex justify-content-center align-items-center rounded" style="height: 300px; cursor: crosshair;">
            Click anywhere inside this box
        </div>

        <div class="alert alert-info mt-4 text-center">
            <strong>X:</strong> <span id="xCoordinate">0</span>
            &nbsp;&nbsp;
            <strong>Y:</strong> <span id="yCoordinate">0</span>
        </div>
    </div>

    <script>
        const mouseArea = document.querySelector("#mouseArea");
        mouseArea.addEventListener("click", function(event) {
            const x = event.clientX;
            const y = event.clientY;
            document.querySelector("#xCoordinate").textContent = x;
            document.querySelector("#yCoordinate").textContent = y;
        });
    </script>
</body>
</html>
