<!-- 10,11. Display a list of 3 movies (hardcoded) and add a 'Remove' button next to each. Use addEventListener to remove the movie card from the DOM when its button is clicked. -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <div class="row g-3">

            <div class="col-md-4">
                <div class="card shadow-sm movie-card">
                    <div class="card-body text-center">
                        <h5 class="card-title">Drishyam: The Conclusion</h5>
                        <button class="btn btn-danger remove-btn">Remove</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm movie-card">
                    <div class="card-body text-center">
                        <h5 class="card-title">The Vvaan - Force of the Forrest</h5>
                        <button class="btn btn-danger remove-btn">Remove</button>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card shadow-sm movie-card">
                    <div class="card-body text-center">
                        <h5 class="card-title">Hanuman Ansh</h5>
                        <button class="btn btn-danger remove-btn">Remove</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const removeButtons = document.querySelectorAll(".remove-btn");
        removeButtons.forEach(function(button) {
            button.addEventListener("click", function() {
                const movieCard = button.closest(".col-md-4");
                movieCard.remove();
            });

        });
    </script>
</body>
</html>
