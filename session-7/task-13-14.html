<!-- 13,14. Log the type and coordinates (clientX, clientY) of any mouse event (click, mouseover, etc.) when the user interacts with a Flipkart-style 'Add to Cart' button, using the event object.<br><br><em><strong>Hint:</strong> Access event.type, event.clientX, and event.clientY inside your event handler.</em> -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">
        <div class="card shadow-sm mx-auto" style="max-width: 350px;">
            <div class="card-body text-center">
                <h5 class="card-title">Wireless Headphones</h5>
                <p class="text-muted">Price: ₹1,499</p>

                <button id="cartButton" class="btn btn-warning w-100">Add to Cart</button>
                <p id="message" class="mt-3 mb-0 text-success"></p>
            </div>
        </div>
    </div>

    <script>
        const cartButton = document.querySelector("#cartButton");
        const message = document.querySelector("#message");

        function handleMouseEvent(event) {

            const eventType = event.type;
            const x = event.clientX;
            const y = event.clientY;

            console.log("Event Type:", eventType);
            console.log("X:", x);
            console.log("Y:", y);

            message.textContent =
                "Event: " + eventType +
                " | X: " + x +
                " | Y: " + y;
        }

        cartButton.addEventListener("click", handleMouseEvent);
        cartButton.addEventListener("mouseover", handleMouseEvent);
        cartButton.addEventListener("mousemove", handleMouseEvent);
    </script>
</body>
</html>
