<!-- 4,5. Write a try…catch…finally block that tries to parse a JSON string representing a Flipkart product (e.g., '{"name":"Shoes","price":999}'). If parsing fails, catch the error and log 'Invalid product data', and in the finally block, log 'Parsing attempt finished'. -->


<script>
    try {
        const product = JSON.parse('{"name":"Shoes","price":999}');
        console.log(product);
    } catch (error) {
        console.log("Invalid product data");
    } finally {
        console.log("Parsing attempt finished");
    }
</script>
