<!-- 9. Write a function getOrderTotal(items) for a Zomato-style food order, where items is an array of objects with name and price. If any price is negative, throw a custom Error('Invalid item price'). Use try...catch to handle the error and display a friendly message. -->


<script>
    function getOrderTotal(items) {
    let total = 0;

    items.forEach(item => {
        if (item.price < 0) {
            throw new Error("Invalid item price");
        }

        total += item.price;
    });

    return total;
    }

    const items = [
        { name: "Pizza", price: 299 },
        { name: "Burger", price: 199 },
        { name: "Fries", price: -50 }
    ];

    try {
        const total = getOrderTotal(items);
        console.log(`Order total: ${total}`);
    } catch (error) {
        console.log("Sorry, there is an invalid item price in your order.");
    }
</script>
