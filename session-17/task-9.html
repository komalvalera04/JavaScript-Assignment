<!-- 9. Add a feature to your cart UI so that when a new product card is added dynamically (for example, by clicking an 'Add Random Product' button), the 'X' remove functionality still works without adding any new event listeners. -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>My Shopping Cart</h2>

            <button id="addProduct" class="btn btn-primary">+ Add Random Product</button>
        </div>

        <div id="cart" class="row g-3">
            <div class="col-md-6 product-card">
                <div class="card shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-1">Redmi Note 12</h5>
                            <p class="text-muted mb-0">₹18,999</p>
                        </div>
                        <button class="remove-btn btn btn-outline-danger">X</button>
                    </div>
                </div>
            </div>

            <div class="col-md-6 product-card">
                <div class="card shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-1">OnePlus 12</h5>
                            <p class="text-muted mb-0">₹64,999</p>
                        </div>
                        <button class="remove-btn btn btn-outline-danger">X</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const cart = document.getElementById("cart");
        const addProduct = document.getElementById("addProduct");

        const products = [
            { name: "iPhone 15", price: 69999 },
            { name: "Sony Headphones", price: 7499 },
            { name: "Samsung Galaxy S24", price: 79999 },
            { name: "Boat Earbuds", price: 1999 }
        ];

        cart.addEventListener("click", function (event) {
            if (event.target.classList.contains("remove-btn")) {
                event.target.closest(".product-card").remove();
            }
        });

        addProduct.addEventListener("click", function () {
            const product = products[Math.floor(Math.random() * products.length)];
            const card = document.createElement("div");
            card.className = "col-md-6 product-card";
            card.innerHTML = `
                <div class="card shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-1">${product.name}</h5>
                            <p class="text-muted mb-0">₹${product.price}</p>
                        </div>

                        <button class="remove-btn btn btn-outline-danger">X</button>
                    </div>
                </div>
            `;

            cart.appendChild(card);
        });
    </script>
</body>
</html>
