<!-- 4,5. Build a Flipkart-style wishlist where each product card has a 'Remove' button. Add a new product card dynamically when the user clicks 'Add Product'. Ensure that the 'Remove' button works for both existing and newly added cards without attaching new listeners to each card.<br><br><em><strong>Hint:</strong> Use event.target to identify which button was clicked inside the parent listener.</em> -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">My Wishlist</h1>
            <button id="addProduct" class="btn btn-primary">+ Add Product</button>
        </div>

        <div id="wishlist" class="row g-3">
            <div class="col-md-6">
                <div class="card shadow-sm">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                    <h5 class="card-title">Redmi Note 12</h5>
                    <p class="card-text mb-0">₹18,999</p>
                    </div>

                    <button class="remove-btn btn btn-danger btn-sm">Remove</button>
                </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                    <h5 class="card-title">OnePlus 12</h5>
                    <p class="card-text mb-0">₹64,999</p>
                    </div>

                    <button class="remove-btn btn btn-danger btn-sm">Remove</button>
                </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const wishlist = document.getElementById("wishlist");
        const addProduct = document.getElementById("addProduct");

        wishlist.addEventListener("click", function(event) {
        if (event.target.classList.contains("remove-btn")) {
            event.target.closest(".col-md-6").remove();
        }
        });

        addProduct.addEventListener("click", function() {
            const product = document.createElement("div");

            product.className = "col-md-6";

            product.innerHTML = `
                <div class="card shadow-sm">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                    <h5 class="card-title">iPhone 15</h5>
                    <p class="card-text mb-0">₹69,999</p>
                    </div>

                    <button class="remove-btn btn btn-danger btn-sm">
                    Remove
                    </button>
                </div>
                </div>
            `;
            wishlist.appendChild(product);
        });
    </script>
</body>
</html>
