<!-- 10,11. Simulate a notification feed like YouTube, where each notification card has a 'Dismiss' button. When you click 'Dismiss', fade out and remove the card. Make sure the event delegation works for dynamically loaded notifications as well as those present at page load. -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>YouTube Notifications</h2>

            <button id="addNotification" class="btn btn-danger">+ New Notification</button>
        </div>

        <div id="notifications">
            <div class="notification-card card shadow-sm mb-3">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="mb-1">New video from TechWorld</h5>
                        <p class="text-muted mb-0">
                        "10 JavaScript Tricks You Should Know"
                        </p>
                    </div>
                    <button class="dismiss-btn btn btn-outline-secondary btn-sm">Dismiss</button>
                </div>
            </div>

            <div class="notification-card card shadow-sm mb-3">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="mb-1">New video from MusicHub</h5>
                        <p class="text-muted mb-0">
                        "Top 10 Songs This Week"
                        </p>
                    </div>

                    <button class="dismiss-btn btn btn-outline-secondary btn-sm">Dismiss</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const notifications = document.getElementById("notifications");
        const addNotification = document.getElementById("addNotification");

        notifications.addEventListener("click", function (event) {
            if (event.target.classList.contains("dismiss-btn")) {
                    const card = event.target.closest(".notification-card");
                    card.classList.add("fade-out");
                    setTimeout(() => {card.remove();}, 400);
                }
        });

        addNotification.addEventListener("click", function () {
            const card = document.createElement("div");
            card.className = "notification-card card shadow-sm mb-3";
            card.innerHTML = `
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="mb-1">New video from CodeMaster</h5>
                        <p class="text-muted mb-0">
                        "Learn JavaScript Event Delegation"
                        </p>
                    </div>

                    <button class="dismiss-btn btn btn-outline-secondary btn-sm">Dismiss</button>
                </div>
            `;
            notifications.appendChild(card);
        });
    </script>
</body>
</html>
