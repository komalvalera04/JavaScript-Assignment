<!-- 6. Build a Flipkart-style shopping cart UI with cards for each product and an 'X' icon to remove a product. Use event bubbling to ensure clicking the 'X' removes only the correct card without adding separate event listeners to each card. -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-5">

        <div id="cart" class="row g-3">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-1">Redmi Note 12</h5>
                            <p class="text-muted mb-0">₹18,999</p>
                        </div>
                        <button class="remove-btn btn btn-outline-danger btn-sm" aria-label="Remove Redmi Note 12">X</button>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-1">OnePlus 12</h5>
                            <p class="text-muted mb-0">₹64,999</p>
                        </div>
                        <button class="remove-btn btn btn-outline-danger btn-sm" aria-label="Remove OnePlus 12">X</button>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="mb-1">Sony Headphones</h5>
                            <p class="text-muted mb-0">₹7,499</p>
                        </div>
                        <button class="remove-btn btn btn-outline-danger btn-sm" aria-label="Remove Sony Headphones">X</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const cart = document.getElementById("cart");

        cart.addEventListener("click", function (event) {
            if (event.target.classList.contains("remove-btn")) {
                const productCard = event.target.closest(".col-md-6");
                productCard.remove();
            }
        });
    </script>
</body>
</html>
