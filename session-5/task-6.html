<!-- 6. Write an arrow function called formatFollowers that takes a number and returns it formatted as '1.5K' for 1500 or '2M' for 2000000, similar to how Instagram displays follower counts.<br><br><em><strong>Hint:</strong> Use conditional logic to check the number's size and format accordingly.</em> -->


<script>
    const formatFollowers = (number) => {
        if (number >= 1000000) {
            return (number / 1000000) + "M";
        } else if (number >= 1000) {
            return (number / 1000) + "K";
        } else {
            return number;
        }
    };

    console.log(formatFollowers(1500));     // 1.5K
    console.log(formatFollowers(2000000));  // 2M

</script>
