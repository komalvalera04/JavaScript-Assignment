<!-- 13. Build a reusable function called createPlaylistButton(songName, themeColor) that returns a button element styled with the given color and displaying the song name. Use this function to create and display three buttons for your favorite Spotify tracks. -->


<!DOCTYPE html>
<html>
<head>
    <title>Spotify Playlist</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">
    <h2>My Spotify Playlist</h2>

    <div id="playlist" class="d-flex gap-2"></div>
</div>

<script>
    function createPlaylistButton(songName, themeColor) {
        let button = document.createElement("button");

        button.className = "btn";
        button.style.backgroundColor = themeColor;
        button.style.color = "white";
        button.textContent = songName;

        return button;
    }

    document.getElementById("playlist").appendChild(
        createPlaylistButton('memories', "orange")
    );

    document.getElementById("playlist").appendChild(
        createPlaylistButton('believer', "purple")
    );

    document.getElementById("playlist").appendChild(
        createPlaylistButton('dandelions', "green")
    );
</script>

</body>
</html>
