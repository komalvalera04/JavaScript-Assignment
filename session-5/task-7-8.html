<!-- 7,8. Rewrite the following function as an arrow function: function formatFollowers(count) { if(count >= 1000) { return (count/1000).toFixed(1) + 'K'; } return count; } -->


<script>
    const formatFollowers = (count) => {
        if (count >= 1000) {
            return (count / 1000).toFixed(1) + "K";
        }
        return count;
    };

    console.log(formatFollowers(1500)); // 1.5K
    console.log(formatFollowers(500));  // 500

</script>
