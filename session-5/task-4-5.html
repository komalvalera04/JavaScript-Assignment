<!-- 4,5. Write a function expression named getDiscountedPrice that takes a price and a discount percent, and returns the final price after applying the discount (e.g., for Flipkart-style sale banners). -->


<script>
    const getDiscountedPrice = function(price, discountPercent) {
        return price - (price * discountPercent / 100);
    };

    console.log(getDiscountedPrice(1000, 20)); // 800

</script>
