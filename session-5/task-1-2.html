<!-- 1,2. Create a function declaration called createSpotifyButton(label, color) that returns an HTML button element with the given label and background color, and display it on the page. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function createSpotifyButton(label, color) {        
            return `<button style="background-color: ${color};">${label}</button>`;
        }

        let button = createSpotifyButton("Play Spotify", "green");

        document.body.innerHTML += button;

    </script>
</body>
</html>
