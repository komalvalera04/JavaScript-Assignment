<!-- 10,11. Build a mini Zomato-style feature: write a function showMenuItem(name, price) that returns a styled HTML div with the food item's name and price, then call it for three different items and display them on the page.<br><br><em><strong>Hint:</strong> Use template literals and document.body.appendChild or innerHTML to add the divs.</em> -->


<!DOCTYPE html>
<html>
<head>
    <title>Zomato Menu</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <h1 class="text-center mb-4">Zomato Menu</h1>

    <div id="menu" class="row">
        <div id="item1" class="col-md-4 mb-3"></div>
        <div id="item2" class="col-md-4 mb-3"></div>
        <div id="item3" class="col-md-4 mb-3"></div>
    </div>
</div>

<script>
    function showMenuItem(name, price) {
        let div = document.createElement("div");

        div.className = "card shadow-sm";

        div.innerHTML = `
            <div class="card-body">
                <h3 class="card-title">${name}</h3>
                <p class="card-text">Price: ₹${price}</p>
            </div>
        `;

        return div;
    }

    document.getElementById("item1").appendChild(
        showMenuItem("Paneer Pizza", 299)
    );

    document.getElementById("item2").appendChild(
        showMenuItem("Veg Biryani", 199)
    );

    document.getElementById("item3").appendChild(
        showMenuItem("Masala Dosa", 149)
    );
</script>

</body>
</html>
