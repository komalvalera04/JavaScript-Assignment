<!-- 9. Create a function declaration called createLikeButton(label, color) that returns a styled HTML button element with the given label and background color. Append the button to the document body. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function createLikeButton(label, color) {
            let button = document.createElement("button");

            button.textContent = label;
            button.style.backgroundColor = color;

            return button;
        }

        let likeButton = createLikeButton("Like", "blue");

        document.body.appendChild(likeButton);
    </script>
</body>
</html>
