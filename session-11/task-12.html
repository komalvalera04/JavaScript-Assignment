<!-- 12. Refactor the following callback-based code to use Promises instead: setTimeout(function() { console.log('Payment successful!'); }, 1000); Ensure the new function returns a Promise and logs the message after 1 second.<br><br><em><strong>Hint:</strong> Use new Promise((resolve, reject) => { ... }) and resolve inside setTimeout.</em> -->


<script>
    function makePayment() {
        return new Promise((resolve, reject) => {
            setTimeout(() => {
                resolve("Payment successful!");
            }, 1000);
        });
    }

    makePayment()
        .then((message) => {
            console.log(message);
        });
</script>
