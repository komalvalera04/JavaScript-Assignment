<!-- 7,8. Build a Promise called getFollowersCount that resolves after 1 second with a random number between 1000 and 5000, then use .then() to display 'You have X new followers' (like Instagram) in the console. -->


<script>
    const getFollowersCount = new Promise(function(resolve) {
        setTimeout(function() {
            const followers =
                Math.floor(Math.random() * 4001) + 1000;
            resolve(followers);
        }, 1000);
    });

    getFollowersCount.then(function(count) {
        console.log(`You have ${count} new followers`);
    });
</script>
