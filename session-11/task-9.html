<!-- 9. Build a function getOrderStatus(orderId) that returns a Promise. Simulate a 1.5 second delay using setTimeout, then resolve with 'Order delivered' if orderId is even, or reject with 'Order not found' if odd. Use .then() and .catch() to handle both cases and log the result. -->

<script>
    function getOrderStatus(orderId) {
        return new Promise(function(resolve, reject) {
            setTimeout(function() {
                if (orderId % 2 === 0) {
                    resolve("Order delivered");
                } else {
                    reject("Order not found");
                }
            }, 1500);
        });
    }

    getOrderStatus(104)
        .then(function(message) {
            console.log(message);
        })
        .catch(function(error) {
            console.log(error);
        });

    getOrderStatus(103)
        .then(function(message) {
            console.log(message);
        })
        .catch(function(error) {
            console.log(error);
        });

</script>
