<!-- 10,11. You have two arrays: const cricketFans = ['Virat', 'Rohit']; const footballFans = ['Messi', 'Ronaldo']; Use the spread operator to combine both arrays into a single array called allFans and log the result.<br><br><em><strong>Hint:</strong> Use [...cricketFans, ...footballFans]</em> -->


<script>
    const cricketFans = ["Virat", "Rohit"];
    const footballFans = ["Messi", "Ronaldo"];
    const allFans = [...cricketFans, ...footballFans];
    console.log(allFans);
</script>
