<!-- 15. Write an arrow function called getFollowersSummary that takes any number of follower counts (using the rest operator), sums them, and returns a string like 'Total followers: 1200'. Call it with 3 sample numbers to test. -->


<script>
    const getFollowersSummary = (...followers) => {
        const total = followers.reduce((sum, count) => sum + count, 0);
        return `Total followers: ${total}`;
    };
    console.log(getFollowersSummary(500, 400, 300));
</script>
