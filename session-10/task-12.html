<!-- 12. Use the spread operator to combine two arrays: your favorite Zomato dishes and your favorite Swiggy dishes, into a single array called allDishes, then log allDishes.<br><br><em><strong>Hint:</strong> Use [...array1, ...array2] syntax.</em> -->


<script>
    const zomatoDishes = ["Biryani", "Pizza", "Paneer Tikka"];
    const swiggyDishes = ["Burger", "Dosa", "Noodles"];
    const allDishes = [...zomatoDishes, ...swiggyDishes];
    console.log(allDishes);
</script>
