<!-- 15. Fetch a list of albums from https://jsonplaceholder.typicode.com/albums, then filter and display only those albums where the userId is 2. Show the filtered album titles in the console.<br><br><em><strong>Constraint:</strong> Use only fetch(), .then(), and array methods (no async/await).</em> -->


<script>
    fetch("https://jsonplaceholder.typicode.com/albums")
    .then(response => response.json())
    .then(albums => {
        const filteredAlbums = albums.filter(album => album.userId === 2);

        filteredAlbums.forEach(album => {
        console.log(album.title);
        });
    })
    .catch(error => console.error("Error:", error));

</script>
