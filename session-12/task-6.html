<!-- 6. Send a POST request using fetch() to https://jsonplaceholder.typicode.com/posts with a JSON body containing a title and body (your own text), then log the response object and check if the id property is present in the response.<br><br><em><strong>Hint:</strong> Set the Content-Type header to 'application/json' and use JSON.stringify() for the body.</em> -->


<script>
    fetch("https://jsonplaceholder.typicode.com/posts", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        title: "My New Post",
        body: "This is some sample post content."
    })
    })
    .then(response => response.json())
    .then(data => {
        console.log("Response object:", data);

        if ("id" in data) {
        console.log("ID is present:", data.id);
        } else {
        console.log("ID is not present.");
        }
    })
    .catch(error => console.error("Error:", error));

</script>
