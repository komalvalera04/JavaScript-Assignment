<!-- 10,11. Chain two fetch() calls: first, fetch a user from https://jsonplaceholder.typicode.com/users/2, then use that user's id to fetch their posts from https://jsonplaceholder.typicode.com/posts?userId=2, and finally log the user's name and the titles of their posts. -->


<script>
    fetch("https://jsonplaceholder.typicode.com/users/2")
    .then(response => response.json())
    .then(user => {
        return fetch(`https://jsonplaceholder.typicode.com/posts?userId=${user.id}`)
        .then(response => response.json())
        .then(posts => {
            console.log("User:", user.name);
            console.log("Post titles:");

            posts.forEach(post => {
            console.log(post.title);
            });
        });
    })
    .catch(error => console.error("Error:", error));
</script>
