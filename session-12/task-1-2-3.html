<!-- 1,2,3. Use fetch() to get a list of posts from https://jsonplaceholder.typicode.com/posts and display the first 5 post titles in the browser console. -->


<script>
    fetch("https://jsonplaceholder.typicode.com/posts")
        .then(response => response.json())
        .then(posts => {
            posts.slice(0, 5).forEach(post => {
                console.log(post.title);
            });
        })
        .catch(error => console.error("Error:", error));
</script>
