<!-- 7,8. Create a function addNewPlaylist() that sends a POST request using fetch() to https://jsonplaceholder.typicode.com/posts with a playlist object containing a name and description. Log the response JSON to the console.<br><br><em><strong>Hint:</strong> Use method: 'POST' and headers: { 'Content-Type': 'application/json' } in your fetch options.</em> -->


<script>
    function addNewPlaylist() {
    const playlist = {
        name: "My Favorite Songs",
        description: "A playlist of songs I love listening to."
    };

    fetch("https://jsonplaceholder.typicode.com/posts", {
        method: "POST",
        headers: {
        "Content-Type": "application/json"
        },
        body: JSON.stringify(playlist)
    })
        .then(response => response.json())
        .then(data => {
        console.log("Response JSON:", data);
        })
        .catch(error => {
        console.error("Error:", error);
        });
    }

    addNewPlaylist();

</script>
