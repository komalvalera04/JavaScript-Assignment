<!-- 4,5. Build a function fetchTopMovies() that uses fetch() to get movie data from https://jsonplaceholder.typicode.com/albums, parses the JSON response, and logs the titles of the first 3 items as if they were trending movies on BookMyShow. -->


<script>
    function fetchTopMovies() {
    fetch("https://jsonplaceholder.typicode.com/albums")
        .then(response => response.json())
        .then(movies => {
        movies.slice(0, 3).forEach(movie => {
            console.log(`Trending Movie: ${movie.title}`);
        });
        })
        .catch(error => console.error("Error fetching movies:", error));
    }

    fetchTopMovies();

</script>
