<!-- 10,11. Edit your HTML file to include a <h2> tag with the text 'Top 3 Food Apps'. Use JavaScript in a <script> tag to change the color of this heading to green when the page loads.<br><br><em><strong>Hint:</strong> Use document.querySelector to select the heading and style.color to change its color.</em> -->
 

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 id="h2title">Top 3 Food Apps</h2>
    <script>
        let myh2 = document.getElementById('h2title');
        myh2.style.color = "green";
    </script>
</body>
</html>
