<!-- 10,11. Given the following broken function, run it in your browser and use the stack trace in the console to identify which function call caused the error: function placeOrder() { confirmOrder(); } function confirmOrder() { processPayment(); } function processPayment() { throw new Error('Payment failed'); } placeOrder();<br><br><em><strong>Hint:</strong> Expand the error in the console to see the call stack.</em> -->

<h3>The function that actually caused the error is processPayment(), because it contains:</h3>
throw new Error("Payment failed");

<script>
    function placeOrder() {
        confirmOrder();
    }

    function confirmOrder() {
        processPayment();
    }

    function processPayment() {
        throw new Error("Payment failed");
    }

    placeOrder();

</script>
