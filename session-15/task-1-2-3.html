<!-- 1,2,3. Declare a JavaScript class named Playlist that has a constructor accepting two parameters: name and songs (an array). Create an instance for a Spotify playlist called 'Chill Vibes' with 3 song names. -->


<script>
    class Playlist {
        constructor(name, songs) {
            this.name = name;
            this.songs = songs;
        }
    }

    const chillVibes = new Playlist("Chill Vibes", [
        "Believer",
        "Perfect",
        "Memories"
    ]);

    console.log(chillVibes);

</script>
