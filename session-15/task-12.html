<!-- 12. Extend the Playlist class by adding a method addSong(songName) that adds a new song to the songs array. Demonstrate by adding two songs and displaying the updated playlist. -->


<script>
    class Playlist {
        constructor(name, songs) {
            this.name = name;
            this.songs = songs;
        }

        addSong(songName) {
            this.songs.push(songName);
        }

        displayPlaylist() {
            console.log(`Playlist: ${this.name}`);
            console.log(`Songs: ${this.songs.join(", ")}`);
        }
    }

    const favoritePlaylist = new Playlist("Chill Vibes", [
        "Believer",
        "Perfect",
        "Memories"
    ]);

    favoritePlaylist.addSong("Shape of You");
    favoritePlaylist.addSong("Dandelions");

    favoritePlaylist.displayPlaylist();
</script>
