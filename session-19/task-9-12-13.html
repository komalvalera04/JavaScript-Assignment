<!-- 9. Display the list of added restaurants below the form, showing name, cuisine, and rating for each, with Edit and Delete buttons next to each entry. -->

<!-- 12. Implement the Delete feature so that when the user clicks the Delete button for any restaurant, it is removed from both the array and the displayed list instantly.<br><br><em><strong>Hint:</strong> Use the array's splice() method and re-render the list after deletion.</em> -->

<!-- 13. Add an Edit feature: when the Edit button is clicked for a restaurant, pre-fill the form with that restaurant's details, allow the user to update them, and save the changes back to the array and UI. -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Restaurant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container py-5">

        <!-- Add Restaurant Form -->
        <div class="col-md-6 mx-auto">

            <div class="card shadow">
                <div class="card-body p-4">

                    <h2 class="mb-4">Add Restaurant</h2>

                    <form id="restaurantForm">

                        <!-- Restaurant Name -->
                        <div class="mb-3">
                            <label for="restaurantName" class="form-label">
                                Restaurant Name
                            </label>

                            <input type="text" id="restaurantName" class="form-control"
                                placeholder="Enter restaurant name" required>
                        </div>

                        <!-- Cuisine -->
                        <div class="mb-3">
                            <label for="cuisine" class="form-label">
                                Cuisine
                            </label>

                            <input type="text" id="cuisine" class="form-control"
                                placeholder="e.g. Indian, Chinese, Italian" required>
                        </div>

                        <!-- Rating -->
                        <div class="mb-3">
                            <label for="rating" class="form-label">
                                Rating
                            </label>

                            <input type="number" id="rating" class="form-control" min="0" max="5" step="0.1"
                                placeholder="e.g. 4.5" required>
                        </div>

                        <button type="submit" class="btn btn-danger w-100">
                            Add Restaurant
                        </button>

                    </form>

                </div>
            </div>

        </div>


        <!-- Restaurant List -->
        <div class="col-md-10 mx-auto mt-5">

            <h3 class="mb-3">Added Restaurants</h3>

            <div class="table-responsive">
                <table class="table table-bordered table-striped align-middle">

                    <thead class="table-danger">
                        <tr>
                            <th>#</th>
                            <th>Restaurant Name</th>
                            <th>Cuisine</th>
                            <th>Rating</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="restaurantList">
                        <!-- Restaurants will be displayed here -->
                    </tbody>

                </table>
            </div>

        </div>

    </div>


    <script>
        // Array to store restaurants
        const restaurants = [];

        // Store the index of the restaurant currently being edited
        let editIndex = -1;

        const form = document.getElementById("restaurantForm");
        const restaurantList = document.getElementById("restaurantList");


        // Add / Update Restaurant
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            // Get form values
            const name = document.getElementById("restaurantName").value;
            const cuisine = document.getElementById("cuisine").value;
            const rating = Number(document.getElementById("rating").value);

            // Create restaurant object
            const restaurant = {
                name: name,
                cuisine: cuisine,
                rating: rating
            };

            // If editing, update existing restaurant
            if (editIndex !== -1) {
                restaurants[editIndex] = restaurant;

                // Reset edit mode
                editIndex = -1;

                // Change button text back to Add Restaurant
                form.querySelector("button[type='submit']").textContent =
                    "Add Restaurant";
            } else {
                // Otherwise add a new restaurant
                restaurants.push(restaurant);
            }

            // Update displayed list
            displayRestaurants();

            // Clear form
            form.reset();
        });


        // Display Restaurants
        function displayRestaurants() {

            restaurantList.innerHTML = "";

            restaurants.forEach(function (restaurant, index) {

                const row = document.createElement("tr");

                row.innerHTML = `
            <td>${index + 1}</td>
            <td>${restaurant.name}</td>
            <td>${restaurant.cuisine}</td>
            <td>${restaurant.rating}</td>

            <td>
                <button class="btn btn-warning btn-sm me-2" onclick="editRestaurant(${index})">Edit</button>
                <button class="btn btn-danger btn-sm" onclick="deleteRestaurant(${index})">Delete</button>
            </td>
        `;

                restaurantList.appendChild(row);
            });
        }


        // Edit Restaurant
        function editRestaurant(index) {

            const restaurant = restaurants[index];

            // Pre-fill the form
            document.getElementById("restaurantName").value = restaurant.name;
            document.getElementById("cuisine").value = restaurant.cuisine;
            document.getElementById("rating").value = restaurant.rating;

            // Store the index being edited
            editIndex = index;

            // Change button text
            form.querySelector("button[type='submit']").textContent =
                "Update Restaurant";

            // Scroll to form
            form.scrollIntoView({
                behavior: "smooth"
            });
        }


        // Delete Restaurant
        function deleteRestaurant(index) {

            // Remove restaurant from array
            restaurants.splice(index, 1);

            // Re-render the list
            displayRestaurants();

            // If the deleted restaurant was being edited, reset edit mode
            if (editIndex === index) {
                editIndex = -1;
                form.reset();

                form.querySelector("button[type='submit']").textContent =
                    "Add Restaurant";
            }
        }

    </script>

</body>

</html>
