<!-- 1,2. Create an HTML file with a simple form that lets a user add a new playlist (name, description) like Spotify's 'Create Playlist' feature, and use JavaScript to store the playlist data in an array. -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-5">
        <div class="col-md-6 mx-auto">

            <div class="card bg-secondary text-white shadow">
                <div class="card-body p-4">

                    <h2 class="mb-4">Create Playlist</h2>

                    <form id="playlistForm">

                        <div class="mb-3">
                            <label for="playlistName" class="form-label">
                                Playlist Name
                            </label>

                            <input type="text" id="playlistName" class="form-control" placeholder="My Chill Playlist"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="playlistDescription" class="form-label">Description</label>

                            <textarea id="playlistDescription" class="form-control" rows="3"
                                placeholder="Add a description..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Create Playlist
                        </button>

                    </form>

                </div>
            </div>

        </div>
    </div>

    <script>
        // Array to store playlists
        const playlists = [];

        const form = document.getElementById("playlistForm");
        const playlistList = document.getElementById("playlistList");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const name = document.getElementById("playlistName").value;
            const description =
                document.getElementById("playlistDescription").value;

            // Create playlist object
            const playlist = {
                name: name,
                description: description
            };

            // Store playlist in array
            playlists.push(playlist);

            console.log("Playlist created:", playlist);
            console.log("All playlists:", playlists);

            // Clear form
            form.reset();
        });
    </script>
</body>

</html>
