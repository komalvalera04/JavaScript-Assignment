<!-- 4,5. Display the list of playlists below the form, showing each playlist's name and description, and update the display every time a new playlist is added. -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-5">
        <div class="col-md-6 mx-auto">

            <!-- Create Playlist Form -->
            <div class="card bg-secondary text-white shadow">
                <div class="card-body p-4">

                    <h2 class="mb-4">Create Playlist</h2>

                    <form id="playlistForm">

                        <div class="mb-3">
                            <label for="playlistName" class="form-label">
                                Playlist Name
                            </label>

                            <input type="text" id="playlistName" class="form-control" placeholder="My Chill Playlist"
                                required>
                        </div>

                        <div class="mb-3">
                            <label for="playlistDescription" class="form-label">
                                Description
                            </label>

                            <textarea id="playlistDescription" class="form-control" rows="3"
                                placeholder="Add a description..." required></textarea>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Create Playlist
                        </button>

                    </form>

                </div>
            </div>

            <!-- Playlist List -->
            <div class="mt-4">
                <h3>My Playlists</h3>

                <div id="playlistList"></div>
            </div>

        </div>
    </div>

    <script>
        const playlists = [];

        const form = document.getElementById("playlistForm");
        const playlistList = document.getElementById("playlistList");

        // Display all playlists
        function displayPlaylists() {
            playlistList.innerHTML = "";

            playlists.forEach(function (playlist) {
                playlistList.innerHTML += `
          <div class="card bg-light text-dark mb-3">
            <div class="card-body">
              <h5 class="card-title">${playlist.name}</h5>
              <p class="card-text">${playlist.description}</p>
            </div>
          </div>
        `;
            });
        }

        // Add new playlist
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const name = document.getElementById("playlistName").value;
            const description =
                document.getElementById("playlistDescription").value;

            const playlist = {
                name: name,
                description: description
            };

            // Add playlist to array
            playlists.push(playlist);

            // Update display
            displayPlaylists();

            // Clear form
            form.reset();
        });
    </script>
</body>

</html>
