<!-- 6. Create an HTML file with a Zomato-style 'Add Restaurant' form (name, cuisine, rating), and use JavaScript to collect the form data and store each entry in an array. -->


<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container py-5">

        <div class="col-md-6 mx-auto">

            <div class="card shadow">
                <div class="card-body p-4">

                    <h2 class="mb-4">Add Restaurant</h2>

                    <form id="restaurantForm">

                        <!-- Restaurant Name -->
                        <div class="mb-3">
                            <label for="restaurantName" class="form-label">
                                Restaurant Name
                            </label>

                            <input type="text" id="restaurantName" class="form-control"
                                placeholder="Enter restaurant name" required>
                        </div>

                        <!-- Cuisine -->
                        <div class="mb-3">
                            <label for="cuisine" class="form-label">
                                Cuisine
                            </label>

                            <input type="text" id="cuisine" class="form-control"
                                placeholder="e.g. Indian, Chinese, Italian" required>
                        </div>

                        <!-- Rating -->
                        <div class="mb-3">
                            <label for="rating" class="form-label">
                                Rating
                            </label>

                            <input type="number" id="rating" class="form-control" min="0" max="5" step="0.1"
                                placeholder="e.g. 4.5" required>
                        </div>

                        <button type="submit" class="btn btn-danger w-100">
                            Add Restaurant
                        </button>

                    </form>

                </div>
            </div>

        </div>

    </div>

    <script>
        // Array to store restaurants
        const restaurants = [];

        const form = document.getElementById("restaurantForm");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            // Get form values
            const name = document.getElementById("restaurantName").value;
            const cuisine = document.getElementById("cuisine").value;
            const rating = document.getElementById("rating").value;

            // Create restaurant object
            const restaurant = {
                name: name,
                cuisine: cuisine,
                rating: Number(rating)
            };

            // Store restaurant in array
            restaurants.push(restaurant);

            console.log("Restaurant added:", restaurant);
            console.log("All restaurants:", restaurants);

            // Clear form
            form.reset();
        });
    </script>
</body>

</html>
