<!-- 13,14. Create an array called orders, where each order is an object with properties: orderId, items (an array of objects with itemName and price), and delivery (an object with address and status). Write a loop to display each order's orderId and total price of all items.<br><br><em><strong>Hint:</strong> Use a nested loop or array method to sum the prices inside each order.</em> -->


<script>
    const orders = [
        {
            orderId: 101,
            items: [
                {
                    itemName: "Wireless Mouse",
                    price: 599
                },
                {
                    itemName: "Keyboard",
                    price: 999
                }
            ],
            delivery: {
                address: "Ahmedabad",
                status: "Out for Delivery"
            }
        },

        {
            orderId: 102,
            items: [
                {
                    itemName: "Headphones",
                    price: 1499
                },
                {
                    itemName: "USB Cable",
                    price: 299
                },
                {
                    itemName: "Phone Stand",
                    price: 399
                }
            ],
            delivery: {
                address: "Mumbai",
                status: "Delivered"
            }
        },

        {
            orderId: 103,
            items: [
                {
                    itemName: "Smart Watch",
                    price: 2499
                },
                {
                    itemName: "Power Bank",
                    price: 1299
                }
            ],
            delivery: {
                address: "Delhi",
                status: "Processing"
            }
        }
    ];

    orders.forEach(function(order) {

        let totalPrice = 0;

        order.items.forEach(function(item) {
            totalPrice += item.price;
        });

        console.log(
            "Order ID: " + order.orderId +
            " - Total Price: ₹" + totalPrice
        );
    });

</script>
