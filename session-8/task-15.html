<!-- 15. Create an array called favApps with 5 objects, each having title and url. Use splice() to remove the third app and insert a new app object for your most-used app at that position. Log the final array.<br><br><em><strong>Hint:</strong> splice(index, deleteCount, newItem) lets you remove and add in one step.</em> -->


<script>
    const favApps = [
        {
            title: "YouTube",
            url: "https://www.youtube.com"
        },
        {
            title: "Spotify",
            url: "https://www.spotify.com"
        },
        {
            title: "Instagram",
            url: "https://www.instagram.com"
        },
        {
            title: "Netflix",
            url: "https://www.netflix.com"
        },
        {
            title: "WhatsApp",
            url: "https://www.whatsapp.com"
        }
    ];

    favApps.splice(2, 1, {
        title: "Google Chrome",
        url: "https://www.google.com/chrome"
    });

    console.log(favApps);

</script>
