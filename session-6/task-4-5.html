<!-- 4,5. Build a small form with an input box and a button labeled 'Add Song'. When the button is clicked, use querySelector to get the input value and dynamically add a new <li> element with the song name to a <ul id="playlist"> on the page. -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>My Playlist</h2>

    <input type="text" id="songInput" placeholder="Enter song name">
    <button id="addSong">Add Song</button>

    <ul id="playlist"></ul>

    <script>
        document.querySelector("#addSong").addEventListener("click", function () {
        const songName = document.querySelector("#songInput").value.trim();

        if (songName !== "") {
            const li = document.createElement("li");
            li.textContent = songName;

            document.querySelector("#playlist").appendChild(li);

            document.querySelector("#songInput").value = "";
        }
        });
    </script>
</body>
</html>
